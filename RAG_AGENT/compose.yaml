name: zhanggui
x-app: &app
  build: .
  env_file: .env
  environment: &app-environment
    POSTGRES_EXPECTED_DATABASE: zhanggui
    POSTGRES_EXPECTED_USER: zhanggui_app
    POSTGRES_DSN: postgresql+psycopg://zhanggui_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/zhanggui
    REDIS_URL: redis://redis:6379/0
    MILVUS_URI: http://milvus:19530
    NEO4J_URI: bolt://neo4j:7687
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp:size=1g,mode=1777"]
  pids_limit: 256
  mem_limit: 4g
  restart: unless-stopped
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_DB: zhanggui
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set POSTGRES_BOOTSTRAP_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/01-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap -d zhanggui"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j-data:/data"]
  milvus:
    image: milvusdb/milvus:v2.6.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports: ["127.0.0.1:19530:19530", "127.0.0.1:9091:9091"]
    volumes:
      - milvus-data:/var/lib/milvus
      - ./deploy/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./deploy/milvus.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      retries: 5
  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && python scripts/setup_checkpoints.py"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *app
    command: ["python", "-m", "app.worker", "--tenant", "${TENANT_ID:?Set TENANT_ID after bootstrap}"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  mineru:
    profiles: ["parser"]
    image: ${MINERU_IMAGE:-quay.io/opendatalab/mineru:latest}
    command: ["mineru-api", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["127.0.0.1:8001:8001"]
    volumes: ["mineru-models:/root/.cache"]
volumes:
  postgres-data:
  neo4j-data:
  milvus-data:
  mineru-models:
